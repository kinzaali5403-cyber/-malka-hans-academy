(function () {
  if (window.claude && typeof window.claude.use === 'function') return;
  var memStore = {};
  function readCol(col) {
    try {
      var raw = window.localStorage.getItem('offline_db_' + col);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return memStore[col] || {};
    }
  }
  function writeCol(col, data) {
    memStore[col] = data;
    try {
      window.localStorage.setItem('offline_db_' + col, JSON.stringify(data));
    } catch (e) {}
  }
  var listeners = {};
  function notify(col) {
    var map = readCol(col);
    var docs = Object.keys(map).map(function (id) {
      var record = Object.assign({}, map[id]);
      return {
        id: id,
        data: function () { return Object.assign({}, record); }
      };
    });
    var snap = { docs: docs, size: docs.length };
    (listeners[col] || []).forEach(function (cb) {
      try { cb(snap); } catch (err) {}
    });
  }
  var dbApi = {
    collection: function (col) {
      return {
        onSnapshot: function (cb) {
          listeners[col] = listeners[col] || [];
          listeners[col].push(cb);
          setTimeout(function () { notify(col); }, 0);
          return function () {
            listeners[col] = (listeners[col] || []).filter(function (f) { return f !== cb; });
          };
        },
        doc: function (id) {
          return {
            set: function (data) {
              var map = readCol(col);
              map[id] = Object.assign({}, data);
              writeCol(col, map);
              notify(col);
              return Promise.resolve();
            },
            update: function (patch) {
              var map = readCol(col);
              map[id] = Object.assign({}, map[id] || {}, patch);
              writeCol(col, map);
              notify(col);
              return Promise.resolve();
            },
            delete: function () {
              var map = readCol(col);
              delete map[id];
              writeCol(col, map);
              notify(col);
              return Promise.resolve();
            }
          };
        }
      };
    }
  };
  var downloadsApi = {
    save: function (opts) {
      try {
        var blob = new Blob([opts.data || ''], { type: 'text/csv;charset=utf-8' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = opts.filename || 'export.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        return Promise.resolve(true);
      } catch (e) {
        return Promise.resolve(false);
      }
    }
  };
  window.claude = {
    use: function (name) {
      if (name === 'db') return Promise.resolve(dbApi);
      if (name === 'downloads') return Promise.resolve(downloadsApi);
      return Promise.resolve(null);
    }
  };
})();
</script>

 <div><label>Course</label><select id="f_course" onchange="autoEnd()"><option value="">— select —</option>${D.courses.map(c=>`<option value="${c.id}" ${s.course==c.id?'selected':''}>${E(c.name)}</option>`).join('')}</select></div>

async function putAtt(sid,date,st){const id=date+'_'+sid,old=D.attendance.find(a=>a.id==id);await save('attendance',id,{sid,date,st,course:stu(sid).course,hist:[...(old?.hist||[]),{st:old?.st||'',at:new Date().toISOString()}]})}

async function allP(d){if(!confirm('Mark all shown students Present on '+d+'?'))return;for(const s of D.students.filter(s=>s.status=='Active'&&(!AC||s.course==AC)))await putAtt(s.id,d,'Present')}
